# ==================================================================================================
# Pyproject Configuration for the pinax Package
#
# Pinax reconciles a folder of reference files with a Zotero library. It reads the library, matches
# each file to an item, writes a change plan, generates the Zotero script that applies the plan, and
# verifies the library against the plan afterwards.
# ==================================================================================================

# --- Build System Requirements --------------------------------------------------------------------

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"


# --- Package Metadata -----------------------------------------------------------------------------

[project]
name = "pinax"
version = "0.0.0"
authors = [{name = "Esther Poniatowski", email = "55659704+esther-poniatowski@users.noreply.github.com"}]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
readme = {file = "README.md", content-type = "text/markdown"}
description = "Reconciles a folder of reference files with a Zotero library and applies verified change plans."
keywords = ["zotero", "bibliography", "reconciliation", "pdf", "better-bibtex"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha"
]
urls = {homepage = "https://github.com/esther-poniatowski/pinax"}


# --- Dependencies ---------------------------------------------------------------------------------

requires-python = ">=3.12"

dependencies = [
    "pyyaml",
    "typer",
]


# --- Package Source Code --------------------------------------------------------------------------

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pinax = ["defaults.yml"]

# --- CLI Entry Points -----------------------------------------------------------------------------

[project.scripts]
pinax = "pinax.cli:app"

# --- Tool Configurations --------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
